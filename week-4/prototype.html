<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stride • 16-screen prototype</title><style>
:root{--brand:#115e59;--ink:#172033;--muted:#475569;--bg:#f1f5f9;--line:#64748b;--lime:#d9f99d}*{box-sizing:border-box}body{margin:0;background:#e4ebe8;font:16px/1.5 system-ui,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{min-height:48px;padding:12px 18px;border:0;border-radius:12px;background:var(--brand);color:white;font-weight:700;cursor:pointer}button:hover{background:#134e4a}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}button.secondary{color:var(--brand);background:white;border:1px solid var(--line)}button:disabled{background:var(--muted)}header{padding:20px 28px;background:white;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header img{width:150px}.layout{display:grid;grid-template-columns:280px 1fr;gap:32px;max-width:1300px;margin:32px auto;padding:0 24px}.directory{background:white;border-radius:20px;padding:20px}.directory button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);font-size:14px;padding:8px 12px;min-height:44px}.directory button[aria-current=page]{background:#d9f99d}.phone{width:min(390px,100%);background:white;border-radius:32px;box-shadow:0 20px 65px #17203322;min-height:780px;margin:auto;padding:24px;border:1px solid #cbd5e1}.screen{animation:enter .2s ease-out}.status{font-size:12px;display:flex;justify-content:space-between;margin-bottom:28px}.brand{font-size:14px;color:var(--brand);font-weight:800;letter-spacing:2px}h1{font-size:28px;line-height:36px;margin:12px 0 16px}h2{font-size:20px;line-height:28px;margin:0 0 8px}p{margin:8px 0 20px}.muted{color:var(--muted)}.hero-icon{width:108px;height:108px;margin:28px 0}.card{background:var(--bg);border-radius:20px;padding:20px;margin:16px 0}.value{font-size:40px;line-height:48px;font-weight:800}.actions{display:grid;gap:12px;margin:24px 0}.tag{display:inline-block;padding:4px 12px;background:var(--lime);border-radius:24px;font-size:12px;font-weight:700}.field{display:grid;gap:8px;margin:16px 0;font-weight:600}input,select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:white}input[type=checkbox]{width:24px;min-height:24px;height:24px}.check{display:flex;align-items:center;gap:12px;margin:16px 0}.error{color:#b91c1c}.nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #cbd5e1;margin-top:24px;padding-top:12px}.nav button{padding:8px;color:var(--brand);background:white;font-size:14px}.nav button[aria-current=page]{text-decoration:underline;text-underline-offset:5px}.bars{height:140px;display:flex;align-items:flex-end;gap:16px}.bar{flex:1;background:var(--brand);border-radius:8px 8px 0 0;text-align:center;color:white;padding-top:8px;min-height:30px}.small{font-size:12px;color:var(--muted)}progress{width:100%;accent-color:var(--brand)}.gallery{max-width:1800px;margin:40px auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:24px}.specimen{background:white;border:1px solid #cbd5e1;border-radius:24px;padding:20px;min-height:600px;pointer-events:none}.specimen h1{font-size:24px}.specimen .hero-icon{width:64px;height:64px;margin:8px 0}.specimen .actions button{font-size:14px}.wire .specimen{filter:grayscale(1)}.wire .specimen .hero-icon{opacity:.2}.wire .specimen{border-radius:2px;box-shadow:none}.wire .specimen .card,.wire .specimen button{border-radius:2px}.hidden{display:none}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:0 12px}.directory{max-height:180px;overflow:auto}.grid{grid-template-columns:1fr}.phone{border-radius:24px}.gallery{padding:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><img src="assets/logo.svg" alt="Stride"><div><button id="gallery-toggle" class="secondary">View all 16 screens</button> <a href="index.html">Case study & portfolio</a></div></header><div class="layout"><aside class="directory" aria-label="Prototype screen directory"></aside><main class="phone" id="phone"></main></div><section class="gallery hidden" id="gallery"><h1>16 high-fidelity screens</h1><p>Visual specimens. Use the interactive phone above for the key flows.</p><button class="secondary" id="wire-toggle">Show wireframe treatment</button><div class="grid" id="grid"></div></section>
<script>
let selected=0,type='Walk',minutes=20,distance='1.5',goal=3,reminders=false,time='18:00',saved=false;
const names=['Welcome','Track your way','Stay in control','Goal setup','Today','Choose activity','Log activity','Review','Saved','Progress','History','Activity detail','Edit activity','Profile','Preferences','Reminders'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';
const btn=(label,to,secondary=false)=>'<button '+(secondary?'class="secondary" ':'')+'data-to="'+to+'">'+label+'</button>';
const actions=(s)=>'<div class="actions">'+s+'</div>';
const icon=name=>'<img class="hero-icon" src="assets/'+name+'.svg" alt="">';
const nav=current=>'<nav class="nav" aria-label="App navigation">'+[[4,'Today'],[9,'Progress'],[13,'Profile']].map(([to,name])=>'<button data-to="'+to+'" '+(current===to?'aria-current="page"':'')+'>'+name+'</button>').join('')+'</nav>';
function view(i){const m=esc(minutes),d=esc(distance),t=esc(type);
const form=(edit=false)=>'<form data-form="activity"><label class="field">Duration (minutes)<input name="duration" type="number" min="1" max="1440" value="'+m+'" required></label><label class="field">Distance (km, optional)<input name="distance" type="number" min="0" step=".1" value="'+d+'"></label><p class="error" role="alert"></p><div class="actions"><button type="submit">Review '+(edit?'changes':'activity')+'</button>'+btn('Back',edit?11:5,true)+'</div></form>';
const pages=[
icon('activity')+'<h1>Small steps.<br>Real progress.</h1><p class="muted">Make room for movement, one session at a time.</p>'+actions(btn('Get started',1)+btn('Explore the demo',4,true)),
icon('activity')+'<h1>Track your way</h1><p class="muted">Log a walk, run or workout in moments. No wearable needed.</p>'+card('Keep it simple','<p>Choose an activity. Add the minutes. You’re ready.</p>')+actions(btn('Continue',2)+btn('Back',0,true)),
icon('goal')+'<h1>You’re in control</h1><p class="muted">Choose a goal that fits your week. Reminders are optional, and your activity stays private.</p>'+actions(btn('Set my goal',3)+btn('Back',1,true)),
'<h1>Your weekly goal</h1><p class="muted">Start small. Change it whenever you need.</p><form data-form="goal"><label class="field">Sessions per week<select name="goal">'+[1,2,3,4,5,6,7].map(v=>'<option '+(v===goal?'selected':'')+'>'+v+'</option>').join('')+'</select></label>'+card('A flexible routine','<p>A short walk counts. Missing a day doesn’t erase your progress.</p>')+'<button type="submit">Save goal</button></form>',
'<h1>Hi, Aanya</h1><p class="muted">Every session counts.</p>'+card('This week','<span class="tag">Your weekly goal</span><div class="value">'+(saved?3:2)+' / '+goal+'</div><progress value="'+Math.min(saved?3:2,goal)+'" max="'+goal+'" aria-label="Weekly sessions"></progress><p>sessions completed</p>')+actions(btn('+ Log activity',5))+card('Recent activity','<p>Walk · 20 minutes<br>Strength · 30 minutes</p>')+nav(4),
'<h1>Choose activity</h1><p class="muted">What did you do?</p>'+actions(['Walk','Run','Strength','Cycle'].map(v=>'<button class="secondary" data-type="'+v+'">'+v+' →</button>').join('')+btn('Back',4,true)),
'<h1>Log '+t.toLowerCase()+'</h1><p class="muted">Manual entry · Today</p>'+form(),
'<h1>Review activity</h1>'+card(t,'<div class="value">'+m+' min</div><p>'+(d?d+' km · ':'')+'Today</p>')+card('Only you can see this','<p>Activity is private in this concept.</p>')+actions('<button data-save>Save activity</button>'+btn('Edit details',12,true)),
icon('success')+'<h1>Activity saved</h1><p role="status">You made time to move. Nice work.</p>'+card(t+' · '+m+' minutes','<p>Your weekly total has been updated for this session.</p>')+actions(btn('View progress',9)+btn('Back to Today',4,true)),
'<h1>Your progress</h1><p class="muted">This week · Sample totals</p>'+card('Consistency','<div class="value">'+(saved?3:2)+' sessions</div><p>'+((saved?50:30)+Number(minutes))+' active minutes</p><div class="bars" aria-label="Daily activity minutes: Monday 30, Tuesday 20, Thursday 20"><div class="bar" style="height:120px">30</div><div class="bar" style="height:80px">20</div><div class="bar" style="height:80px">20</div></div><p class="small">Mon / Tue / Thu · minutes</p>')+actions(btn('View history',10)+btn('Adjust goal',3,true))+nav(9),
'<h1>Activity history</h1>'+card('Today',actions(btn(t+' · '+m+' minutes',11,true)))+card('Earlier this week','<p>Walk · 20 min<br>Strength · 30 min</p>')+actions(btn('Log another activity',5)+btn('Back to progress',9,true)),
'<h1>Activity detail</h1>'+card(t,'<div class="value">'+m+' min</div><p>'+(d?d+' km':'Distance not entered')+'<br>Today · Manual entry</p>')+actions(btn('Edit activity',12)+btn('Back to history',10,true)),
'<h1>Edit activity</h1><p class="muted">Update the details before saving.</p>'+form(true),
'<h1>Your profile</h1>'+card('Aanya Mehta','<p>Demo profile<br>Goal: '+goal+' sessions per week</p>')+actions(btn('Preferences',14)+btn('Reminders',15,true))+nav(13),
'<h1>Preferences</h1>'+card('Privacy','<p>Activity visibility: Only me</p>')+card('Accessibility','<p>Text uses your browser settings. Animation respects your device’s reduced-motion preference.</p>')+card('Demo data','<p>Entries stay in memory and reset when you reload. No real account or health integration.</p>')+actions(btn('Reminder settings',15)+btn('Back to profile',13,true)),
'<h1>Reminders</h1><p class="muted">A nudge when it works for you.</p><form data-form="reminders"><label class="check"><input name="enabled" type="checkbox" '+(reminders?'checked':'')+'> Remind me to move</label><label class="field">Preferred time<input name="time" type="time" value="'+esc(time)+'"></label><p class="small">Demo preference only; no notifications are sent.</p><button type="submit">Save preference</button></form>'+actions(btn('Back',13,true))
];return '<div class="screen"><div class="status"><span>9:41</span><span>100%</span></div><div class="brand">STRIDE</div>'+pages[i]+'</div>';}
function render(i,focus=true){selected=i;document.querySelector('#phone').innerHTML=view(i);document.querySelector('.directory').innerHTML=names.map((s,n)=>'<button data-screen="'+n+'" '+(n===i?'aria-current="page"':'')+'>'+String(n+1).padStart(2,'0')+' / '+s+'</button>').join('');const h=document.querySelector('#phone h1');h.tabIndex=-1;if(focus)h.focus();}
document.querySelector('.directory').onclick=e=>{const b=e.target.closest('[data-screen]');if(b)render(Number(b.dataset.screen));};
document.querySelector('#phone').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.to!==undefined)render(Number(b.dataset.to));if(b.dataset.type){type=b.dataset.type;render(6)}if(b.hasAttribute('data-save')){saved=true;render(8)}};
document.querySelector('#phone').onsubmit=e=>{e.preventDefault();const f=e.target,v=new FormData(f);if(f.dataset.form==='activity'){const n=Number(v.get('duration'));const dist=v.get('distance');if(!Number.isFinite(n)||n<=0||(dist&&Number(dist)<0)){f.querySelector('.error').textContent='Enter positive minutes and a distance of 0 or more.';f.querySelector('input').focus();return}minutes=n;distance=dist;render(7)}if(f.dataset.form==='goal'){goal=Number(v.get('goal'));render(4)}if(f.dataset.form==='reminders'){reminders=v.has('enabled');time=v.get('time');render(13)}};
document.querySelector('#gallery-toggle').onclick=()=>{const g=document.querySelector('#gallery');g.classList.toggle('hidden');if(!g.classList.contains('hidden')){document.querySelector('#grid').innerHTML=names.map((s,i)=>'<article class="specimen"><p class="small">'+String(i+1).padStart(2,'0')+' / '+s+'</p>'+view(i)+'</article>').join('');g.scrollIntoView({behavior:'auto'})}};
document.querySelector('#wire-toggle').onclick=()=>document.querySelector('#gallery').classList.toggle('wire');
render(0,false);
</script></body></html>
